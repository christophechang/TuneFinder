  rave:                jungle
  "drum n bass":       drum-and-bass
  "drum and bass":     drum-and-bass
  dnb:                 drum-and-bass
  "uk garage":         uk-garage-bassline
  ukg:                 uk-garage-bassline
  garage:              uk-garage-bassline
