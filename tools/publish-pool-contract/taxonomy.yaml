# Contradictory pairs at family level, re-derived from TuneFinder's tag pairs
# (electronica<->ukg, electronica<->dnb, ukg<->dnb, ukg<->techno, dnb<->house). Legitimate
# overlap (electronica with downtempo, house with techno) is deliberately not listed.
exclusions:
  electronica-downtempo: [uk-garage, drum-and-bass]
  uk-garage:             [electronica-downtempo, drum-and-bass, techno]
  drum-and-bass:         [uk-garage, house, electronica-downtempo]
  house:                 [drum-and-bass]
  techno:                [uk-garage]
